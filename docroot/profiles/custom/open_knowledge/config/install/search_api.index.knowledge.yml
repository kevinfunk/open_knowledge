langcode: en
status: false
dependencies:
  config:
    - field.storage.node.field_cause
    - field.storage.node.field_environment
    - field.storage.node.body
    - field.storage.node.field_resolution
    - field.storage.node.field_tags
  module:
    - node
    - search_api
id: knowledge
name: Knowledge
description: ''
read_only: false
field_settings:
  body:
    label: 'Issue » Processed text'
    datasource_id: 'entity:node'
    property_path: 'body:processed'
    type: text
    boost: 1.2
    dependencies:
      config:
        - field.storage.node.body
  cause:
    label: 'Cause » Processed text'
    datasource_id: 'entity:node'
    property_path: 'field_cause:processed'
    type: text
    dependencies:
      config:
        - field.storage.node.field_cause
  changed:
    label: Changed
    datasource_id: 'entity:node'
    property_path: changed
    type: date
    dependencies:
      module:
        - node
  created:
    label: 'Authored on'
    datasource_id: 'entity:node'
    property_path: created
    type: date
    dependencies:
      module:
        - node
  environment:
    label: 'Environment » Processed text'
    datasource_id: 'entity:node'
    property_path: 'field_environment:processed'
    type: text
    dependencies:
      config:
        - field.storage.node.field_environment
  field_tags:
    label: Tags
    datasource_id: 'entity:node'
    property_path: field_tags
    type: integer
    dependencies:
      config:
        - field.storage.node.field_tags
  resolution:
    label: 'Resolution » Processed text'
    datasource_id: 'entity:node'
    property_path: 'field_resolution:processed'
    type: text
    dependencies:
      config:
        - field.storage.node.field_resolution
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: 1.5
    dependencies:
      module:
        - node
  type:
    label: 'Content type'
    datasource_id: 'entity:node'
    property_path: type
    type: string
    dependencies:
      module:
        - node
  uid:
    label: 'Authored by'
    datasource_id: 'entity:node'
    property_path: uid
    type: integer
    dependencies:
      module:
        - node
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - article
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  custom_value: {  }
  entity_status: {  }
  entity_type: {  }
  highlight:
    weights:
      postprocess_query: 0
    prefix: '<strong>'
    suffix: '</strong>'
    excerpt: true
    excerpt_always: false
    excerpt_length: 256
    exclude_fields: {  }
    highlight: always
    highlight_partial: true
  html_filter:
    weights:
      preprocess_index: -15
      preprocess_query: -15
    all_fields: true
    fields:
      - body
      - cause
      - environment
      - resolution
      - title
      - type
    title: true
    alt: true
    tags:
      b: 2
      em: 1
      h1: 5
      h2: 3
      h3: 2
      strong: 2
      u: 1
  ignorecase:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: false
    fields:
      - body
      - cause
      - resolution
      - title
      - type
  language_with_fallback: {  }
  rendered_item: {  }
  stemmer:
    weights:
      preprocess_index: 0
      preprocess_query: 0
    all_fields: false
    fields: {  }
    exceptions:
      mexican: mexic
      texan: texa
  tokenizer:
    weights:
      preprocess_index: -6
      preprocess_query: -6
    all_fields: false
    fields: {  }
    spaces: ''
    ignored: ._-
    overlap_cjk: 1
    minimum_word_size: '3'
  transliteration:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: false
    fields:
      - body
      - cause
      - resolution
      - title
      - type
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  index_directly: true
  track_changes_in_references: true
server: ''
